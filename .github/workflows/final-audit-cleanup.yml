name: Final Audit Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-audit-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply historical cleanup
        run: node tools/cleanup-final-audit.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: archive migration history and remove stale source headers"
          git push origin HEAD:main
