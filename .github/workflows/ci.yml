name: QXFRAME CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'migration-logs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qxframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Completion audit
        run: npm run audit:completion

      - name: Full release verification
        run: npm run release

      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload dist and npm package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30
