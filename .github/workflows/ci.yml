name: QXFRAME CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'migration-logs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qxframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full release verification
        run: npm run release

      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload dist and npm package
        uses: actions/upload-artifact@v4
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30
