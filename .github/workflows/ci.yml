name: QXFRAME CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'migration-logs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qxframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Completion audit
        run: npm run audit:completion

      - name: Full release verification
        run: npm run release

      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload dist and npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30
