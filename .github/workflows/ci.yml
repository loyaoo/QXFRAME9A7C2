# Pages refresh marker: 2026-09-24
name: QXFRAME CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qxframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Completion audit
        run: npm run audit:completion

      - name: Full release verification
        run: npm run release

      - name: Generate Phase B CSS inventory
        shell: bash
        run: |
          mkdir -p artifacts
          npm run audit:css-token-phase-b -- --write=artifacts/css-token-phase-b-inventory.json

      - name: Upload Phase B CSS inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: css-token-phase-b-inventory-${{ github.sha }}
          path: artifacts/css-token-phase-b-inventory.json
          retention-days: 7

      - name: Persist Phase B inventory once
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/css-token-phase-b-inventory'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -f tools/manifests/css-token-phase-b-inventory.json ]; then
            echo "Phase B inventory already persisted."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const headers={
            Authorization:`Bearer ${process.env.GH_TOKEN}`,
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          };
          const generated=fs.readFileSync('artifacts/css-token-phase-b-inventory.json');
          const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/tools/manifests/css-token-phase-b-inventory.json`,{
            method:'PUT',
            headers,
            body:JSON.stringify({
              message:'audit: persist Phase B CSS consumer inventory',
              content:generated.toString('base64'),
              branch:process.env.HEAD_REF
            })
          });
          if(!response.ok) throw new Error(`Persist Phase B inventory failed: ${response.status} ${await response.text()}`);
          console.log('Persisted Phase B inventory.');
          NODE

      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Build standalone dist + docs demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf demo-package
          mkdir -p demo-package
          cp -a dist demo-package/
          cp -a docs demo-package/
          cp tools/demo-package/demo-server.mjs demo-package/
          cp tools/demo-package/START-DEMO.cmd demo-package/
          cp tools/demo-package/README-DEMO.txt demo-package/
          printf 'commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > demo-package/BUILD-INFO.txt
          touch demo-package/.nojekyll
          cat > demo-package/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./docs/">
            <title>QXFRAME9A7C2 DEMO</title>
          </head>
          <body>
            <p><a href="./docs/">打开 QXFRAME9A7C2 Components DEMO</a></p>
          </body>
          </html>
          HTML

          node demo-package/demo-server.mjs >/tmp/qxframe-demo.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/docs/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/docs/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/dist/qxframe9a7c2.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/dist/qxframe9a7c2.css >/dev/null

          node tools/verify-canonical-docs.mjs demo-package
          node tools/demo-package/verify-canonical-docs-browser.mjs
          node tools/demo-package/verify-demo-server.mjs demo-package

          kill "$DEMO_PID"
          trap - EXIT

          (cd demo-package && zip -qr ../artifacts/qxframe9a7c2-dist-docs-demo.zip .)

      - name: Upload dist and npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30

      - name: Upload standalone dist + docs demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qxframe9a7c2-dist-docs-demo-${{ github.sha }}
          path: artifacts/qxframe9a7c2-dist-docs-demo.zip
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: demo-package

  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows tool paths
        run: npm run verify:windows-tool-paths

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
