name: QXFRAME CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'migration-logs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qxframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Completion audit
        run: npm run audit:completion

      - name: Full release verification
        run: npm run release

      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Build standalone dist + docs demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf demo-package
          mkdir -p demo-package
          cp -a dist demo-package/
          cp -a docs demo-package/
          cp tools/demo-package/demo-server.mjs demo-package/
          cp tools/demo-package/START-DEMO.cmd demo-package/
          cp tools/demo-package/README-DEMO.txt demo-package/
          printf 'commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > demo-package/BUILD-INFO.txt

          node demo-package/demo-server.mjs >/tmp/qxframe-demo.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/docs/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/docs/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/dist/qxframe9a7c2.js >/dev/null
          curl --fail --silent http://127.0.0.1:4173/dist/qxframe9a7c2.css >/dev/null

          test "$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/%2e%2e/package.json')" = "403"
          test "$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/%')" = "400"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST 'http://127.0.0.1:4173/docs/')" = "405"
          test "$(curl --silent --head --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/docs/')" = "200"
          test "$(curl --silent --head 'http://127.0.0.1:4173/docs/' | tr -d '\r' | grep -i '^X-Content-Type-Options: nosniff
          (cd demo-package && zip -qr ../artifacts/qxframe9a7c2-dist-docs-demo.zip .)

      - name: Upload dist and npm package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30

      - name: Upload standalone dist + docs demo
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qxframe9a7c2-dist-docs-demo-${{ github.sha }}
          path: artifacts/qxframe9a7c2-dist-docs-demo.zip
          retention-days: 30
 | wc -l)" = "1"

          ln -s /etc/passwd demo-package/escape-test
          test "$(curl --path-as-is --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4173/escape-test')" = "403"
          rm demo-package/escape-test

          kill "$DEMO_PID"
          trap - EXIT

          (cd demo-package && zip -qr ../artifacts/qxframe9a7c2-dist-docs-demo.zip .)

      - name: Upload dist and npm package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qxframe9a7c2-${{ github.sha }}
          path: |
            dist/
            artifacts/*.tgz
          retention-days: 30

      - name: Upload standalone dist + docs demo
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qxframe9a7c2-dist-docs-demo-${{ github.sha }}
          path: artifacts/qxframe9a7c2-dist-docs-demo.zip
          retention-days: 30
