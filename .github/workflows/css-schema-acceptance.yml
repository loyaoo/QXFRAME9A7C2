name: CSS Schema Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qx-css-schema-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install audit dependencies
        run: npm ci --ignore-scripts
      - name: Build canonical CSS
        run: npm run build
      - name: Enforce one public Theme system
        run: npm run verify:theme-single-system
      - name: Verify the sole Theme Studio surface
        run: npm run verify:theme-studio-static
      - name: Verify canonical component consumers
        run: node tools/verify-browser-smoke.mjs --required --docs-only
      - name: Verify Theme source equivalence and sparse output
        run: npm run verify:theme-visual-v2-browser
      - name: Verify Theme Studio configuration and visible controls
        run: npm run verify:theme-studio-v2-browser
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: css-schema-acceptance-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
