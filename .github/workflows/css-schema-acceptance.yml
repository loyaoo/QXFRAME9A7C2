name: CSS Schema Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qx-css-schema-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install audit dependencies
        run: npm ci --ignore-scripts
      - name: Verify acceptance detector
        run: node tools/verify-css-schema-acceptance-audit.mjs
      - name: Verify static colors against offline Chromium baseline
        run: node tools/verify-css-static-colors.mjs --browser
      - name: Verify docs preset colors and actual Button states
        run: node tools/verify-css-doc-preset-colors.mjs
      - name: Verify frozen public Theme interface and scoped portal expression
        run: npm run build && node tools/verify-theme-schema-v1.mjs --browser
      - name: Verify semantic v2 source equivalence and sparse output
        run: node tools/verify-theme-visual-v2.mjs --browser
      - name: Verify v2 Studio selections and configuration roundtrip
        run: node tools/verify-theme-studio-v2.mjs --browser
      - name: Enforce Schema acceptance with Chromium evidence
        run: node tools/audit-css-schema-acceptance.mjs --browser --enforce --write=artifacts/css-schema-acceptance.json
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: css-schema-acceptance-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
