name: CSS Schema Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qx-css-schema-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install audit dependencies
        run: npm ci --ignore-scripts
      - name: Apply reviewed Theme Schema v1 snapshot
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          node tools/freeze-theme-schema.mjs --write
          if git diff --quiet -- docs/generated/theme-public-schema-v1.json docs/generated/theme-color-recipes-v1.json; then
            echo "Frozen snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/theme-public-schema-v1.json docs/generated/theme-color-recipes-v1.json
          git commit -m "fix(theme): refresh reviewed Schema v1 snapshot"
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify acceptance detector
        run: node tools/verify-css-schema-acceptance-audit.mjs
      - name: Verify static colors against offline Chromium baseline
        run: node tools/verify-css-static-colors.mjs --browser
      - name: Verify docs preset colors and actual Button states
        run: node tools/verify-css-doc-preset-colors.mjs
      - name: Verify frozen public Theme interface and scoped portal expression
        run: npm run build && node tools/verify-theme-schema-v1.mjs --browser
      - name: Enforce Schema acceptance with Chromium evidence
        run: node tools/audit-css-schema-acceptance.mjs --browser --enforce --write=artifacts/css-schema-acceptance.json
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: css-schema-acceptance-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
