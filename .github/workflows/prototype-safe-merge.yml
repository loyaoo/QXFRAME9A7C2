name: Prototype Safe Merge Codemod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-safe-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Apply safe merge codemod
        run: node tools/codemod-prototype-safe-merge.mjs
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: route object patches through safe merge primitives"
          git push origin HEAD:main
