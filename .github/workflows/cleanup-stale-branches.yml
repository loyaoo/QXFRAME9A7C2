name: One-time stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete audited stale branches
        env:
          STALE_BRANCHES: |

        run: |
          set -euo pipefail
          deleted=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Already absent: $branch"
            fi
          done <<< "$STALE_BRANCHES"
          echo "Deleted $deleted stale branches."
