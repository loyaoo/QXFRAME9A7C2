name: Patch Theme v1.5 Checkpoint
on:
  push:
    branches: [feat/theme-visual-v2-style]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/theme-visual-v2-style
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: node tools/patch-theme-v15-checkpoint.mjs
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/theme-generator/studio-v2.mjs QXFRAME9A7C2-Theme-Visual-System-v1.5.md AI_WORK_STATE.md
          git commit -m "docs(theme): record single-system v1.5 decision"
          git push origin HEAD:feat/theme-visual-v2-style
