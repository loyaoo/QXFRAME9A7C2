name: Patch Theme Visual Verifier
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/theme-visual-v2-style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/theme-visual-v2-style
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: node tools/patch-theme-visual-verifier-single-system.mjs
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/verify-theme-visual-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(theme): align visual verifier with single system"
          git push origin HEAD:feat/theme-visual-v2-style
