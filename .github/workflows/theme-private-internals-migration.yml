name: Theme Private Internals Migration

on:
  push:
    branches: [feat/theme-visual-v2-style]

permissions:
  contents: write

concurrency:
  group: qxframe-theme-private-internals-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/theme-visual-v2-style
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: node tools/migrate-theme-private-internals.mjs
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles tools/manifests/css-order.json tools/verify-release-preflight.mjs
          git commit -m "refactor(theme): privatize retired token internals"
          git push origin HEAD:feat/theme-visual-v2-style
