name: Purge Legacy Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-legacy-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove archived migration debris
        shell: bash
        run: |
          rm -rf archive/legacy-migration
          rm -f .github/workflows/purge-legacy-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove archived migration debris from current tree"
          git push origin HEAD:main
