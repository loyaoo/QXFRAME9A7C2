<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>QX Tree Large Data QA</title>
<link rel="stylesheet" href="../../dist/qxframe9a7c2.css">
<style>body{font:1rem/1.5 Arial,sans-serif;padding:1.5rem;max-width:45rem;margin:auto}.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}button[data-action]{padding:.5rem}.summary{margin-bottom:.8rem}</style>
<script src="../../dist/qxframe9a7c2.js"></script></head>
<body><h1>Tree 3000-row VirtualList, async paging, lazy nodes and edits</h1>
<div class="row"><button data-action="next">Load next page</button><button data-action="expand">Expand lazy branch</button><button data-action="retry">Retry failed branch</button><button data-action="measure">Refresh metrics</button></div>
<div class="summary" data-status>Preparing…</div><div data-tree></div>
<script>
(function(){
'use strict';
var C=window.QXFRAME9A7C2&&window.QXFRAME9A7C2.Components,el=document.querySelector('[data-status]');
if(!C||!C.Tree){el.textContent='Tree unavailable';return;}
var source=Array.from({length:3000},function(_,i){var k='root-'+i;return{key:k,value:k,label:'Workspace '+i};});
source[0]={key:'lazy-root',value:'lazy-root',label:'Lazy branch (first request fails)',hasChildren:true,lazy:true,items:[]};
var page=0,tries=0,tree;
function mutate(rows,detail){
 for(var i=0;i<rows.length;i++){
  if(rows[i].key===detail.key){
   if(detail.type==='rename')rows[i].label=detail.label;
   else if(detail.type==='remove')rows.splice(i,1);
   else if(detail.type==='add'){
    var k='added-'+Date.now();if(!rows[i].items)rows[i].items=[];
    rows[i].items.push({key:k,value:k,label:'New child'});
   }
   return true;
  }
  if(Array.isArray(rows[i].items)&&mutate(rows[i].items,detail))return true;
 }
 return false;
}
function measure(){var s=tree.getState();el.textContent='Visible: '+s.visibleKeys.length+' | Rendered DOM rows: '+s.renderedCount+' | Virtual: '+s.virtual+' | Loading page: '+s.pageLoading+' | Has more: '+s.pageHasMore+' | Lazy errors: '+s.loadErrorKeys.length;}
tree=C.Tree.create({container:document.querySelector('[data-tree]'),items:source,virtual:true,virtualThreshold:120,height:'28rem',maxHeight:'28rem',showLine:true,checkable:true,editable:true,lazy:true,maxNodes:10000,
hasMore:true,pageSize:150,loadMoreThreshold:200,
loadChildren:function(item){return new Promise(function(resolve,reject){setTimeout(function(){tries++;if(tries===1)reject(new Error('Retry demo'));else resolve(Array.from({length:20},function(_,i){var k='lazy-'+i;return{key:k,value:k,label:'Loaded child '+i};}));},120);});},
loadMore:function(ctx){return new Promise(function(resolve){setTimeout(function(){var start=3000+page*150;page++;resolve({items:Array.from({length:150},function(_,i){var k='root-'+(start+i);return{key:k,value:k,label:'Scrolled page row '+(start+i)};}),hasMore:page<7,cursor:page});},100);});},
onOperate:function(detail){if(!mutate(source,detail))return false;tree.setItems(source);measure();return true;},
onLoad:function(children,detail){if(detail.key==='lazy-root')source[0].items=children.slice();measure();},onLoadError:function(){measure();},onLoadMore:function(r){source=source.concat(r.items);measure();},onLoadMoreError:function(){measure();}
});
window.QXFRAME9A7C2_TREE_QA={tree:tree,measure:measure};
document.querySelectorAll('[data-action]').forEach(function(button){button.addEventListener('click',function(){var action=button.dataset.action;if(action==='next')tree.loadNextPage({source:'button'});else if(action==='expand')tree.expand('lazy-root');else if(action==='retry')tree.retryLoad('lazy-root');measure();});});measure();
})();
</script></body></html>
